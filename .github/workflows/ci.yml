name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refuse plaintext in any committed .env file
        # The pre-commit hook runs the same check, but it is bypassable with
        # --no-verify and absent for web-UI commits, so enforce it here too.
        run: pnpm exec dotenvx ext precommit

      - name: Run checks
        env:
          DOTENV_PRIVATE_KEY_CI: ${{ secrets.DOTENV_PRIVATE_KEY_CI }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork || false }}
        run: |
          # check:ci decrypts apps/edge/.env.ci with dotenvx --strict. Only a fork pull
          # request is allowed to skip that: forks cannot read repository secrets, and
          # failing a contributor on a key they cannot have would be wrong. Anywhere
          # else a missing key means the secret was deleted or renamed, which must fail
          # rather than quietly downgrade to an unverified check.
          if [ -n "$DOTENV_PRIVATE_KEY_CI" ]; then
            pnpm run check:ci
          elif [ "$IS_FORK" = "true" ]; then
            echo "::warning::Fork pull request cannot read repository secrets; running checks without the decrypted .env.ci."
            pnpm run check
          else
            echo "::error::DOTENV_PRIVATE_KEY_CI is not set on a non-fork run. The repository secret is missing or renamed."
            exit 1
          fi

  changeset:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a changeset
        run: |
          if ! git diff --name-only --diff-filter=A "origin/${GITHUB_BASE_REF}...HEAD" -- '.changeset/*.md' | grep -q .; then
            echo "Every pull request must add a changeset. Run pnpm changeset for a package release or pnpm changeset --empty for a non-release change." >&2
            exit 1
          fi

  release:
    if: github.event_name == 'push'
    needs: check
    permissions:
      actions: write
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create or update the release pull request
        id: changesets
        uses: changesets/action@v2
        with:
          commit-message: "chore: version packages"
          create-github-releases: false
          pr-title: "chore: version packages"
          push-git-tags: false
          version-script: pnpm version-packages
      - name: Run CI for the release pull request
        if: steps.changesets.outputs.has-changesets == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ steps.changesets.outputs.pr-number }}
        run: |
          release_ref=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}" --jq '.head.ref')
          gh workflow run ci.yml --ref "${release_ref}"

  deploy:
    if: github.event_name == 'push'
    needs: check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    concurrency:
      group: stamppot-personal-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy Worker to the Personal account
        # deploy:production decrypts apps/edge/.env.production, uploads the Worker
        # runtime secrets it declares, then deploys. Only ever runs on push to main,
        # where repository secrets are available.
        run: pnpm run deploy:production
        env:
          CLOUDFLARE_ACCOUNT_ID: d61f96f2a058dbe3857d567eb1779c94
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
